<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01800Studio | Book Your Appointment</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #d4af37; /* Gold accent */
            --text-color: #ffffff;
            --text-muted: #b0b0b0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--accent-color);
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        .confirmation {
            display: none;
            text-align: center;
            padding: 20px 0;
        }
        .confirmation h2 {
            color: #4ade80;
            margin-bottom: 10px;
        }
        .confirmation p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="booking-form-wrapper">
            <h1>01800STUDIO</h1>
            <p class="subtitle">Select your service & time</p>
            
            <form id="bookingForm">
                <div class="form-group">
                    <label for="clientName">Your Name</label>
                    <input type="text" id="clientName" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="clientPhone">Phone Number</label>
                    <input type="tel" id="clientPhone" required placeholder="Your phone number">
                </div>

                <div class="form-group">
                    <label for="service">Select Service</label>
                    <select id="service" required>
                        <option value="" disabled selected>Choose a service</option>
                        <option value="Barber Cut & Style">Barber Cut & Style</option>
                        <option value="Nail Services">Nail Services</option>
                        <option value="Lash Treatment">Lash Treatment</option>
                        <option value="Combo (Hair & Nails)">Combo (Hair & Nails)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="time">Time Slot</label>
                    <select id="time" required>
                        <option value="" disabled selected>Choose a time</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:30 AM">11:30 AM</option>
                        <option value="1:00 PM">1:00 PM</option>
                        <option value="3:00 PM">3:00 PM</option>
                        <option value="4:30 PM">4:30 PM</option>
                        <option value="6:00 PM">6:00 PM</option>
                    </select>
                </div>

                <button type="submit">Confirm Appointment</button>
            </form>
        </div>

        <div id="confirmationBox" class="confirmation">
            <h2>You're Booked!</h2>
            <p id="confDetails"></p>
            <button onclick="resetForm()" style="margin-top: 20px; background: #333; color: #fff;">Book Another</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('bookingForm');
        const wrapper = document.getElementById('booking-form-wrapper');
        const confBox = document.getElementById('confirmationBox');
        const confDetails = document.getElementById('confDetails');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('clientName').value;
            const service = document.getElementById('service').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            confDetails.innerHTML = `Thank you, <strong>${name}</strong>!<br>Your <strong>${service}</strong> is scheduled for <strong>${date}</strong> at <strong>${time}</strong>.`;
            
            wrapper.style.display = 'none';
            confBox.style.display = 'block';
        });

        function resetForm() {
            form.reset();
            confBox.style.display = 'none';
            wrapper.style.display = 'block';
        }
    </script>
</body>
</html>
